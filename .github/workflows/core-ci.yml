name: Núcleo - validação de dados, compilação e testes

on:
  push:
    branches-ignore: [ci-report]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar dados JSON (Python)
        run: |
          set +e
          python3 -I tools/validate_data.py client/Assets/Resources/GameData 2>&1 | tee validate.log
          exit ${PIPESTATUS[0]}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar o núcleo
        run: |
          set +e
          dotnet build ci/core/Mmorpg.Core.csproj -c Release -nologo 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E ": error " build.log | sort -u | head -80 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          exit $status

      - name: Rodar testes
        run: |
          set +e
          export MMORPG_DATA_DIR="$GITHUB_WORKSPACE/client/Assets/Resources/GameData"
          dotnet test ci/tests/Mmorpg.Core.Tests.csproj -c Release -nologo --logger "console;verbosity=normal" 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E ": error " test.log | sort -u | head -80 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          tail -8 test.log | while IFS= read -r l; do echo "::notice::${l:0:300}"; done
          exit $status

      # A camada Unity (client/Assets/Scripts/Game) só compila de verdade dentro do Editor. Aqui ela é compilada contra
      # stubs mínimos da UnityEngine: pega erros de sintaxe/tipos e de uso da API do núcleo, mas NÃO prova que roda na Unity.
      - name: Compilar a camada Unity contra stubs
        run: |
          set +e
          dotnet build ci/game-check/Mmorpg.Game.Check.csproj -c Release -nologo 2>&1 | tee game-check.log
          status=${PIPESTATUS[0]}
          grep -E ": error " game-check.log | sort -u | head -80 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          exit $status

      # Publica os logs numa branch própria para que possam ser lidos sem abrir a interface do GitHub.
      - name: Publicar relatório na branch ci-report
        if: always()
        run: |
          set +e
          mkdir -p /tmp/report
          cp validate.log build.log test.log game-check.log /tmp/report/ 2>/dev/null
          {
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID"
            echo "data=$(date -u +%FT%TZ)"
          } > /tmp/report/info.txt
          cd /tmp/report
          git init -q
          git checkout -q -b ci-report
          git config user.name "ci-report"
          git config user.email "ci-report@users.noreply.github.com"
          git add -A
          git commit -q -m "Relatório do CI para $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-report
