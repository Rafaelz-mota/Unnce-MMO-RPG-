name: Android - gerar APK de teste

# Só roda quando você pedir (Actions > "Android - gerar APK de teste" > Run workflow).
# Antes, é preciso criar os segredos UNITY_LICENSE, UNITY_EMAIL e UNITY_PASSWORD. Passo a passo em docs/APK.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Conferir os segredos da licença Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltam os segredos do repositório:$missing. Veja docs/APK.md (passo 2)."
            exit 1
          fi

      # A imagem do Unity para Android é muito grande; sem isto o disco do runner pode acabar.
      - name: Liberar espaço em disco
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Cache da pasta Library (acelera as próximas builds)
        uses: actions/cache@v4
        with:
          path: client/Library
          key: Library-Android-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Compilar o APK na Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          unityVersion: 6000.0.34f1
          targetPlatform: Android
          buildMethod: Mmorpg.EditorTools.CiBuild.BuildAndroid
          androidExportType: androidPackage
          versioning: None
          allowDirtyBuild: true

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: mmorpg-teste-apk
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14

  # Publica o log do job numa branch (android-report) para que erros de licença ou de compilação possam ser lidos
  # sem abrir a interface do GitHub. Roda mesmo quando o build falha.
  relatorio:
    needs: apk
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publicar relatório na branch android-report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ needs.apk.result }}
        run: |
          set +e
          mkdir -p /tmp/report
          JOB_ID=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name=="apk") | .id')
          gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" > /tmp/report/job-completo.raw 2> /tmp/report/erro-ao-baixar-log.txt
          tail -n 20000 /tmp/report/job-completo.raw > /tmp/report/job-completo.log
          rm -f /tmp/report/job-completo.raw
          grep -nEi "error|exception|fail|licen|compilation|CS[0-9]{4}|CiBuild" /tmp/report/job-completo.log | tail -n 400 > /tmp/report/erros.log
          tail -n 300 /tmp/report/job-completo.log > /tmp/report/final.log
          {
            echo "commit=$GITHUB_SHA"
            echo "run=$RUN_ID"
            echo "resultado_do_build=$RESULT"
            echo "data=$(date -u +%FT%TZ)"
          } > /tmp/report/info.txt
          cd /tmp/report
          git init -q
          git checkout -q -b android-report
          git config user.name "android-report"
          git config user.email "android-report@users.noreply.github.com"
          git add -A
          git commit -q -m "Relatório do build Android para $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" android-report
